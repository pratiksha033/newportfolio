<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CPU Scheduling Simulator</title>
  <link rel="stylesheet" href="styless.css" />
  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="styless.css" />
  <script src="app.js" type="text/javascript"></script>
</head>

<body>
  <header>
    <nav class="navbar ">
      <span class="navbar-text" style="margin:auto; display:table; color:white">
        <h3>CPU Scheduling Algorithms</h3>
      </span>
    </nav>
  </header>

  <div class="container">
    <div class="col-md-12 border border-secondary rounded p-3 mb-2" id="main">
      <div class="col-12 p-4 mb-6" style="margin:auto">
        <div class="form-group">
          <label for="algorithmSelector"><b>Select Scheduling Method</b></label>
          <select class="form-control" id="algorithmSelector">
            <option value="optFCFS">First Come First Served</option>
            <option value="optSJF">Shortest Job First</option>
            <option value="optSRTF">Shortest Remaining Time First</option>
            <option value="optRR">Round Robin</option>
            <option value="optPriority">Priority Scheduling</option>
            <option value="optLRTF">LRTF</option>
          </select>
        </div>

        <div class="form-group form-group-time-quantum">
          <label class="mt-1">Time Quantum :</label>
          <input class="form-control mb-2" type="number" min="1" max="9" id="timeQuantum" />
        </div>

        <table class="table table-bordered border-secondary rounded" id="tblProcessList">
          <thead>
            <tr>
              <th scope="col"><b>Process ID</b></th>
              <th scope="col"><b>Arrival Time</b></th>
              <th scope="col"><b>Burst Time</b></th>
              <th scope="col"><b>Priority</b></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <div class="row">
          <div class="col">
            <input
              class="form-control mb-2"
              type="number"
              min="0"
              id="processID"
              placeholder="Process ID"
              required
            />
          </div>
          <div class="col">
            <input
              class="form-control mb-2"
              type="number"
              min="0"
              id="arrivalTime"
              placeholder="Arrival Time"
            />
          </div>
          <div class="col">
            <input
              class="form-control mb-2"
              type="number"
              min="0"
              id="burstTime"
              placeholder="Burst Time"
            />
          </div>
          <div class="col">
            <input
              class="form-control mb-2"
              type="number"
              min="0"
              id="priority"
              placeholder="Priority (optional)"
            />
          </div>
          <div class="col">
            <button class="btn btn-outline-success" id="btnAddProcess">Add Process</button>
          </div>
          <div class="col">
            <button class="btn btn-outline-secondary" id="resetBtn" onclick="location.reload()">
              Reset
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-12" style="margin:auto">
      <div class="col-md-12 border border-secondary rounded" style="margin:auto">
        <table class="table table-bordered rounded" id="tblResults">
          <thead>
            <tr>
              <th scope="col"><b>Process ID</b></th>
              <th scope="col"><b>Arrival Time</b></th>
              <th scope="col"><b>Burst Time</b></th>
              <th scope="col"><b>Completed Time</b></th>
              <th scope="col"><b>Waiting Time</b></th>
              <th scope="col"><b>Turnaround Time</b></th>
              <th scope="col"><b>Priority</b></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="col-md-12 border border-secondary rounded p-3 mb-2">
      <div class="form">
        <div class="form-group">
          <label for="avgTurnaroundTime">Average Turnaround Time</label>
          <input
            class="form-control"
            id="avgTurnaroundTime"
            type="number"
            placeholder="0"
            disabled
          />
        </div>
        <div class="form-group">
          <label for="avgWaitingTime">Average Waiting Time</label>
          <input
            class="form-control"
            id="avgWaitingTime"
            type="number"
            placeholder="0"
            disabled
          />
        </div>
        <div class="form-group">
          <label for="throughput">Throughput</label>
          <input
            class="form-control"
            id="throughput"
            type="number"
            placeholder="0"
            disabled
          />
        </div>
      </div>
    </div>

    <div class="col-md-12 border border-black rounded p-3 mb-2">
      <p align="center">Gantt Chart Generated</p>
      <table class="table-bordered" id="ganttChart">
        <tbody></tbody>
      </table>
    </div>

    <div class="form-group">
      <button class="btn btn-primary btn-block" id="btnCalculate">Calculate</button>
    </div>
  </div>

  <footer class="page-footer bg-dark p-2 mt-5">
    <div class="footer-copyright text-center py-4">
      <span style="margin:auto; display:table; color:white">
        Operating Systems Project by:<br />
        Pratiksha Parihar
        <br />
      </span>
    </div>
  </footer>
</body>

</html>
